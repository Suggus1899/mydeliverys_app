name: mydeliverys_mobile
description: Aplicaciones Android de cliente y conductor de MyDeliveryS
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  http: ^1.5.0
  web_socket_channel: ^3.0.3

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Geolocation & Maps
  geolocator: ^12.0.0
  google_maps_flutter: ^2.7.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  image_picker: ^1.2.0
  audioplayers: ^6.5.1

  # Utils
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

